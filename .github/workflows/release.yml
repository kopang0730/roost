name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v），例如 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-14          # Apple Silicon（arm64），与内置 Python 运行时一致
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: 拉取内置 Python 运行时
        run: ./scripts/fetch-python.sh

      - name: 编译并打包 DMG
        run: cd app && ./make-dmg.sh "${{ steps.ver.outputs.version }}"

      - name: 自检
        run: |
          codesign --verify --deep --strict "app/build/ExoLocal.app"
          hdiutil attach "app/build/ExoLocal-${{ steps.ver.outputs.version }}.dmg" -nobrowse -quiet
          test -d "/Volumes/ExoLocal ${{ steps.ver.outputs.version }}/ExoLocal.app"
          hdiutil detach "/Volumes/ExoLocal ${{ steps.ver.outputs.version }}" -quiet
          ls -lh "app/build/ExoLocal-${{ steps.ver.outputs.version }}.dmg"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ExoLocal-dmg
          path: app/build/ExoLocal-*.dmg

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "app/build/ExoLocal-${{ steps.ver.outputs.version }}.dmg" \
            --title "ExoLocal ${GITHUB_REF_NAME}" \
            --generate-notes
